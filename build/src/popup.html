<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #c0392b; --accent-text: #c0392b; --card: #f5f5f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #98989d; --line: #38383a; --card: #2c2c2e; --accent-text: #ff7b6b; } }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .count { padding: 18px 16px 8px; text-align: center; }
  .count b { display: block; font-size: 34px; font-weight: 700; color: var(--accent-text); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); }
  .host { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 12px; word-break: break-all; }
  section { padding: 10px 16px; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; cursor: pointer; }
  .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(16px); }
  button.main { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--card); border-radius: 6px; padding: 5px 8px; margin-bottom: 4px; }
  li code { font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .note { color: var(--muted); font-size: 11px; padding: 8px 16px 12px; }
  .off { opacity: .45; pointer-events: none; }
  button.link { border: 0; background: none; color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  button.link:disabled { color: var(--muted); cursor: default; }
  #upd { color: var(--muted); font-size: 12px; }
  .warn { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--card); font-size: 12px; line-height: 1.45; }
  .warn button { display: block; margin-top: 6px; }
  .pro { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: #fff; font: 700 9px/1.5 system-ui, sans-serif; letter-spacing: .06em; vertical-align: 1px; font-style: normal; }
  .locked .switch { opacity: .4; }
  .locked .switch i { cursor: not-allowed; }
  .lic { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lic span { color: var(--muted); font-size: 12px; }
  footer { display: flex; justify-content: space-between; padding: 0 16px 12px; }
  footer button { font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>GRTS Blocker Pro <em class="pro" id="proBadge" hidden>PRO</em></h1>
    <label class="switch" data-i18n-title="toggleTitle"><input type="checkbox" id="enabled"><i></i></label>
  </header>
  <div id="body">
    <div class="count"><b id="blocked">0</b><span data-i18n="blockedOnPage"></span></div>
    <div class="host" id="host"></div>
    <section>
      <div class="row"><span data-i18n="pauseSite"></span><label class="switch"><input type="checkbox" id="pause"><i></i></label></div>
    </section>
    <section>
      <button class="main" id="pick"><span data-i18n="pickElement"></span><em class="pro" id="pickPro">PRO</em></button>
    </section>
    <section id="customBox" hidden>
      <h2 data-i18n="myRules"></h2>
      <ul id="custom"></ul>
    </section>
    <section>
      <h2 data-i18n="filters"></h2>
      <div class="row"><span id="upd">—</span><button class="link" id="updNow" data-i18n="updateNow"></button></div>
      <div class="warn" id="usWarn" hidden>
        <span data-i18n="usWarn"></span>
        <button class="link" id="openSettings" data-i18n="openSettings"></button>
      </div>
      <div class="warn" id="rebuildWarn" hidden data-i18n="rebuildWarn"></div>
    </section>
    <section>
      <h2 data-i18n="protection"></h2>
      <div class="row"><span data-i18n="ads"></span><label class="switch"><input type="checkbox" data-cat="ads"><i></i></label></div>
      <div class="row"><span data-i18n="trackers"></span><label class="switch"><input type="checkbox" data-cat="privacy"><i></i></label></div>
      <div class="row" data-row="annoyances"><span><span data-i18n="cookieNotices"></span><em class="pro">PRO</em></span><label class="switch"><input type="checkbox" data-cat="annoyances"><i></i></label></div>
      <div class="row"><span data-i18n="regionalFilters"></span><label class="switch"><input type="checkbox" data-cat="regional"><i></i></label></div>
    </section>
    <section>
      <h2 data-i18n="privacy"></h2>
      <div class="row" data-row="clean"><span><span data-i18n="cleanLinks"></span><em class="pro">PRO</em></span><label class="switch"><input type="checkbox" data-cat="clean"><i></i></label></div>
      <div class="row" data-row="gpc"><span><span data-i18n="gpc"></span><em class="pro">PRO</em></span><label class="switch"><input type="checkbox" data-cat="gpc"><i></i></label></div>
      <div class="row" data-row="cookies"><span><span data-i18n="thirdPartyCookies"></span><em class="pro">PRO</em></span><label class="switch"><input type="checkbox" data-cat="cookies"><i></i></label></div>
    </section>
    <section>
      <div class="lic"><span id="licText"></span><button class="link" id="licBtn"></button></div>
    </section>
  </div>
  <div class="note" id="note" data-i18n="applyOnReload"></div>
  <footer><button class="link" id="about" data-i18n="licensesSource"></button></footer>
  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
