# Compila GRTS Blocker Pro con las listas de filtros del día y publica los paquetes.
# Corre todos los lunes, en cada cambio del código y cuando se lo pide a mano.
# Los lunes además sube la versión nueva a la Chrome Web Store y a Edge Add-ons
# (a mano, con "Run workflow" y la opción "Subir a las tiendas").
# Necesita los secrets CWS_PUBLISHER_ID, CWS_SERVICE_ACCOUNT, EDGE_CLIENT_ID y EDGE_API_KEY.
name: Compilar GRTS Blocker Pro

on:
  schedule:
    - cron: '17 9 * * 1'   # lunes 06:17 de Argentina
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tiendas:
        description: 'Subir a las tiendas (Chrome y Edge)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install google-re2 soupsieve beautifulsoup4 cryptography

      - name: Descargar listas de filtros
        run: python build/tools/descargar_listas.py

      - name: Compilar las tres variantes
        env:
          GRTS_BUILD: ${{ github.run_number }}   # versión 2.2.0.<número de compilación>
        run: python build/build.py

      - name: Empaquetar
        run: |
          cd dist
          for v in chrome store firefox; do
            (cd GRTSBlockerPro-$v && zip -qr ../GRTSBlockerPro-$v.zip .)
          done
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GRTSBlockerPro
          path: dist/*.zip

      - name: Publicar versión
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="filtros-$(date -u +%Y%m%d)"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.zip --title "GRTS Blocker Pro – filtros del $(date -u +%d/%m/%Y)" \
            --notes "Paquetes compilados automáticamente con las listas de filtros del día."

      - name: Subir a Chrome Web Store y Edge Add-ons
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tiendas)
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: python build/tools/publicar_tiendas.py dist/GRTSBlockerPro-store.zip
